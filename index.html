<!DOCTYPE html>

<meta charset="utf-8">

<title>PointCut UI screenshots</title>
<style>
  /* Self-contained on purpose: a CDN stylesheet that fails to load silently
     breaks the whole layout, and this page has to work offline too. */
  :root { --bg: #fff; --fg: #14161a; --muted: #6b7280; --line: #d8dce2; --accent: #2563eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14161a; --fg: #e8eaed; --muted: #9aa2ad; --line: #333941; --accent: #7aa2f7; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width: 1500px; margin: 0 auto; padding: 0 1rem 3rem; }
  h1 { font-size: 1.3rem; } h2 { font-size: 1rem; margin: 1.5rem 0 .5rem; }
  a { color: var(--accent); }
  nav[data-toc] { position: sticky; top: 0; z-index: 1; padding: .6rem 0; font-size: .8rem;
                  background: var(--bg); border-bottom: 1px solid var(--line); }
  nav[data-toc] a { margin-right: .75rem; white-space: nowrap; display: inline-block; }
  div[data-pair] { display: flex; gap: 1rem; align-items: flex-start; justify-content: center; }
  figure { margin: 0; text-align: center; }
  /* Bound both axes and let the intrinsic ratio pick which one binds: portrait shots
     hit the height cap, the landscape ones (06/07) hit the width cap. Forcing either
     dimension letterboxes the other orientation into a mostly-empty box. */
  div[data-pair] img { max-height: 78vh; max-width: 46vw; width: auto; height: auto;
                       border-radius: 8px; border: 1px solid var(--line); }
  div[data-pair] figure:only-child img { max-width: 92vw; }
  figcaption { font-size: .75rem; color: var(--muted); padding-top: .25rem; }
  table { border-collapse: collapse; } td, th { text-align: left; padding: .3rem 1.5rem .3rem 0; }
  small[data-status] { border-radius: 6px; padding: .1rem .4rem; font-size: .7rem;
                       text-transform: uppercase; letter-spacing: .04em; color: #fff; }
  small[data-status="changed"] { background: #c0392b; }
  small[data-status="new"]     { background: #1e8e4f; }
  small[data-status="same"]    { background: var(--muted); }
</style>
</head>
